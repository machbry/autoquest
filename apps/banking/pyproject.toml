[project]
name = "banking"
version = "0.1.0"
description = "Keep track of my bank accounts and expenses."
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "fastapi",
    "jinja2",
    "psycopg[binary]",
    "pydantic-settings",
    "python-multipart",
    "sqlalchemy",
    "uvicorn",
]

# Fake data for the local seed service (Dockerfile `dev` target); never installed in prd.
[dependency-groups]
dev = ["faker"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
