[project]
name = "banking"
version = "0.1.0"
description = "Keep track of my bank accounts and expenses."
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "fastapi",
    "psycopg[binary]",
    "pydantic-settings",
    "sqlalchemy",
    "uvicorn",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
