<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Banking{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 0 auto; padding: 1rem; line-height: 1.5; }
    header a { color: inherit; font-weight: bold; text-decoration: none; margin-right: 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ddd; }
    form.stacked label { display: block; margin-top: 0.8rem; }
    form.stacked input, form.stacked select { display: block; margin-top: 0.2rem; }
    button { margin-top: 1rem; }
    .error { color: #b00020; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <header><a href="/">Accounts</a><a href="/banks">Banks</a></header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
