<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Banking{% endblock %}</title>
  {# htmx's defaults, plus swapping 422 responses, so validation errors show in place. #}
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"422","swap":true},{"code":"[45]..","swap":false,"error":true},{"code":"...","swap":false}]}'>
  {# Vendored and pinned: no third-party origin at runtime. #}
  <script src="/static/htmx-2.0.11.min.js" defer></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 0 auto; padding: 1rem; line-height: 1.5; }
    header a { color: inherit; font-weight: bold; text-decoration: none; margin-right: 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ddd; }
    form.stacked label { display: block; margin-top: 0.8rem; }
    form.stacked input, form.stacked select { display: block; margin-top: 0.2rem; }
    button { margin-top: 1rem; }
    .error { color: #b00020; }
    .muted { color: #666; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .warning { color: #8a5a00; }
    .alert { color: #b00020; font-weight: bold; }
    .summary { border: 1px solid #ddd; padding: 0 1rem; }
  </style>
</head>
<body>
  <header><a href="/accounts">Accounts</a><a href="/labels/new">Label</a><a href="/banks">Banks</a><a href="/categories">Categories</a></header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
