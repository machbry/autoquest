<tr id="operation-{{ operation.id }}">
  <td>{{ operation.operation_date }}</td>
  <td>{{ operation.description }}</td>
  <td class="num">{{ operation.amount }}</td>
  {% if label %}
  <td>{{ label.category.name }}</td>
  <td>{{ label.tags | join(", ") }}</td>
  <td><a href="/labels/{{ operation.id }}/edit" hx-get="/labels/{{ operation.id }}/edit"
         hx-target="closest tr" hx-swap="outerHTML"{% if focus %} autofocus{% endif %}>Edit label</a></td>
  {% else %}
  <td></td><td></td><td></td>
  {% endif %}
</tr>
