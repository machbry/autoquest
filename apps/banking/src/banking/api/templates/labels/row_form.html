{% from "macros.html" import label_fields with context %}
<tr id="operation-{{ operation.id }}">
  <td>{{ operation.operation_date }}</td>
  <td>{{ operation.description }}</td>
  <td class="num">{{ operation.amount }}</td>
  <td colspan="2">
    <form method="post" action="/labels/{{ operation.id }}" hx-post="/labels/{{ operation.id }}"
          hx-target="closest tr" hx-swap="outerHTML">
      {% if suggestion %}<p class="muted">Suggested from the operation of {{ suggestion.from_date }}.</p>{% endif %}
      {{ label_fields(categories, autofocus_category=True) }}
      <button type="submit">Save</button>
      <a href="/labels/{{ operation.id }}" hx-get="/labels/{{ operation.id }}"
         hx-target="closest tr" hx-swap="outerHTML">Cancel</a>
    </form>
  </td>
</tr>
