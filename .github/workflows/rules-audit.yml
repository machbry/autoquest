# Monthly audit of the code against the CLAUDE.md rules that need judgement (the
# mechanical ones are tests). Opens or updates issues; never touches the code.
# Runs on the Claude subscription (OAuth token from `claude setup-token`), not an API key.
name: Rules audit

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: rules-audit

jobs:
  audit:
    name: Audit code against CLAUDE.md
    runs-on: ubuntu-latest
    # Also caps the subscription usage of a run, with --max-turns.
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Read-only tools plus the GitHub issue tools: no shell, no web, no file writes.
      # github_token: the job's token, so the action needs no GitHub App or OIDC.
      - uses: anthropics/claude-code-action@8d70a0dd265122bd65b8e09d3d959e65373ae2a1 # v1.0.260
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Run the rules-audit skill (.claude/skills/rules-audit/SKILL.md) on the
            whole repository ${{ github.repository }}. You run unattended: nobody can
            answer questions or approve drafts, so file the issues directly.
          claude_args: >-
            --max-turns 150
            --allowedTools
            Read,Glob,Grep,Skill,mcp__github__list_issues,mcp__github__search_issues,mcp__github__get_issue,mcp__github__get_issue_comments,mcp__github__create_issue,mcp__github__add_issue_comment
            --disallowedTools
            Bash,Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch
