# Quality gate on every PR: format, lint, types, tests with coverage, dependency and secret scans.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    env:
      BANKING_DB_URL: postgresql+psycopg://banking:banking@127.0.0.1:5432/banking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Pre-commit hooks (format, lint, types, whitespace)
        run: uv run pre-commit run --all-files --show-diff-on-failure
      # The local stack, as in development: integration tests use its database, e2e
      # tests its web app. Building it also checks the image.
      - name: Start the local stack
        run: docker compose up -d --build --wait banking-web
      - name: Tests (banking)
        run: uv run pytest apps/banking --cov=banking
      - name: Dependency vulnerabilities
        run: |
          uv export --locked --no-emit-workspace --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
